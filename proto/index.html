<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MuseScoreVR</title>
<style>
  body { margin: 0; font: 18px system-ui, sans-serif; background: #111; color: #ddd; padding: 24px; }
  small { color: #888; }
  canvas { display: block; width: 100%; height: 60vh; margin-top: 12px; } /* preview outside VR */
</style>
</head>
<body>
<h1>MuseScoreVR</h1>
<p id="status">En attente d'un morceau envoyé depuis le configurateur…</p>
<p><small>Ou ouvrir un projet présent sur le casque :</small> <input id="file" type="file" accept=".zip,application/zip"></p>
<small>Dans le casque : gâchette sur un musicien = écouter depuis sa place · gâchette sur le podium = chef · poignée = lecture / pause (aussi pilotable depuis le configurateur).</small>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }</script>
<script type="module">
// Headset player: renders a project prepared in config.html; nothing about the orchestra is edited here.
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { S, ctx, play, pause, stop, now, meter, sitAt, setHead, placeAll, facing, seatName, openProject, projectFromUrl, file as entry } from './engine.js';
import { Sheet } from './stands.js';
const status = document.getElementById('status'), file = document.getElementById('file');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.xr.enabled = true;
renderer.domElement.style.display = 'none'; document.body.append(renderer.domElement); // shown once a project is open: preview from your seat
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101014);
scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 2.5), new THREE.GridHelper(40, 40, 0x444444, 0x222222));
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 100);
const rig = new THREE.Group(); rig.add(camera); scene.add(rig);
const band = new THREE.Group(), stands = new THREE.Group(); scene.add(band, stands);
let sheets = []; // one per score, shared by the stands showing it
const podium = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.15, 24), new THREE.MeshStandardMaterial({ color: 0x888888 }));
podium.position.y = 0.075; scene.add(podium);
const cube = new THREE.BoxGeometry(0.5, 0.5, 0.5);

function label(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 48;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.font = '28px system-ui'; x.textAlign = 'center'; x.fillText(text, 128, 34);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  sp.scale.set(1, 0.19, 1); return sp;
}
function build3d() {
  band.children.forEach(o => o.traverse(m => { m.material?.map?.dispose(); m.material?.dispose(); }));
  band.clear();
  S.parts.forEach(p => {
    for (const s of S.seats.filter(s => s.part === p)) {
      const color = new THREE.Color().setHSL(p.hue / 360, 0.6, 0.45);
      const m = new THREE.Mesh(cube, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0 }));
      m.position.set(s.x, 0.75, s.y); m.userData.seat = s;
      const l = label(seatName(s)); l.position.y = 0.45; m.add(l);
      band.add(m);
    }
  });
}
// a stand in front of each musician (and of the podium) with their part, open like a book
async function buildStands() {
  sheets.forEach(sh => sh.texture.dispose()); sheets = []; stands.clear();
  const load = (dir, opts) => dir ? Sheet.load(dir, entry, opts).catch(() => null) : null; // older projects have no scores
  const [full, ...parts] = await Promise.all([load(S.project.sheet, { px: 2048, scale: 1.5, hue: 45 }), ...S.parts.map(p => load(p.sheet, { hue: p.hue }))]);
  const put = (sheet, x, z, [fx, fz], d) => {
    const stand = new THREE.Group(), book = sheet.stand();
    stand.position.set(x + fx * d, 1.15, z + fz * d); stand.rotation.y = Math.atan2(-fx, -fz); // facing its reader
    book.rotation.x = -0.35; stand.add(book); stands.add(stand);
  };
  if (full) put(full, 0, 0, [0, -1], 0.55);
  S.parts.forEach((p, i) => parts[i] && S.seats.filter(s => s.part === p).forEach(s => put(parts[i], s.x, s.y, facing(s), 0.55)));
  sheets = [full, ...parts].filter(Boolean);
}
function teleport(seat) {
  sitAt(seat);
  const [fx, fz] = facing(seat);
  rig.position.set(seat ? seat.x : 0, 0, seat ? seat.y : 0);
  rig.rotation.y = Math.atan2(-fx, -fz); // rotate the rig's -z onto the facing direction
  for (const m of band.children) m.visible = m.userData.seat !== seat; // don't sit inside your own cube
}

// controllers: trigger on a cube = sit there, trigger on the podium = conductor, grip = play/pause
const ray = new THREE.Raycaster(), tmp = new THREE.Matrix4();
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  c.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -5)]), new THREE.LineBasicMaterial({ color: 0xffffff })));
  c.addEventListener('select', () => {
    tmp.identity().extractRotation(c.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(c.matrixWorld); ray.ray.direction.set(0, 0, -1).applyMatrix4(tmp);
    const hit = ray.intersectObjects([...band.children, podium], false)[0];
    if (hit) teleport(hit.object === podium ? null : hit.object.userData.seat);
  });
  c.addEventListener('squeeze', () => S.playing ? pause() : play());
  rig.add(c);
}

const head = new THREE.Vector3(), fwd = new THREE.Vector3(), up = new THREE.Vector3(), q = new THREE.Quaternion();
renderer.setAnimationLoop(() => {
  if (!S.project) return;
  if (renderer.xr.isPresenting) {
    const cam = renderer.xr.getCamera(); // head pose drives the ears
    cam.getWorldPosition(head); cam.getWorldDirection(fwd); up.set(0, 1, 0).applyQuaternion(cam.getWorldQuaternion(q));
    setHead(head.x, head.y, head.z, fwd.x, fwd.y, fwd.z, up.x, up.y, up.z);
  } else { // flat preview: eyes of a seated player, or of the standing conductor
    const c = renderer.domElement; if (c.width !== c.clientWidth) { renderer.setSize(c.clientWidth, c.clientHeight, false); camera.aspect = c.clientWidth / c.clientHeight; camera.updateProjectionMatrix(); }
    camera.position.set(0, S.listener ? 1.2 : 1.65, 0); camera.rotation.x = -0.3;
  }
  meter();
  const t = now(); for (const sh of sheets) sh.update(t);
  for (const m of band.children) { const lv = m.userData.seat.part.level || 0; m.material.emissiveIntensity = 1.5 * lv; m.scale.setScalar(1 + 0.2 * lv); }
  renderer.render(scene, camera);
});
renderer.xr.addEventListener('sessionstart', () => { ctx.resume(); S.headTracked = true; teleport(S.listener); });
renderer.xr.addEventListener('sessionend', () => { S.headTracked = false; pause(); placeAll(); });

async function open(blob) {
  status.textContent = 'Ouverture…';
  const project = await openProject(blob);
  document.title = project.title + ' – MuseScoreVR';
  build3d(); teleport(null); await buildStands();
  renderer.domElement.style.display = '';
  status.textContent = `${project.title} · ${S.seats.length} musiciens — prêt, entrez en VR.`;
  if (!document.getElementById('VRButton')) document.body.append(VRButton.createButton(renderer));
}
const fail = e => status.textContent = 'Erreur : ' + (e.message || e);
file.onchange = () => file.files[0] && open(file.files[0]).catch(fail);
projectFromUrl().then(b => b && open(b)).catch(fail);

// the configurator pushes projects through the Bun server; reconnect if the PC goes away
(function listen() {
  const ws = new WebSocket(`wss://${location.host}/api/events`);
  ws.onmessage = async e => {
    const { cmd } = JSON.parse(e.data); // remote transport from the configurator
    if (cmd) return S.project && { play, pause, stop }[cmd]();
    status.textContent = 'Réception du morceau…';
    try {
      const r = await fetch('/api/project');
      if (!r.ok) throw new Error(`serveur : ${r.status}`);
      await open(await r.blob());
    } catch (e) { fail(e); }
  };
  ws.onclose = () => setTimeout(listen, 2000);
})();
</script>
</body>
</html>
