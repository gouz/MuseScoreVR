<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MuseScoreVR</title>
<style>
  body { margin: 0; font: 18px system-ui, sans-serif; background: #111; color: #ddd; padding: 24px; }
  small { color: #888; }
  canvas { display: block; width: 100%; height: 60vh; margin-top: 12px; } /* preview outside VR */
</style>
</head>
<body>
<h1>MuseScoreVR</h1>
<p id="status"></p>
<p><small id="openLocal"></small> <input id="file" type="file" accept=".zip,application/zip"></p>
<small id="help"></small>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }</script>
<script type="module">
// Headset player: renders a project prepared in config.html; nothing about the orchestra is edited here.
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
import { S, ctx, play, pause, stop, seek, setVolume, MAXVOL, now, meter, sitAt, setHead, placeAll, facing, seatName, openProject, projectFromUrl, file as entry } from './engine.js';
import { Sheet } from './stands.js';
import { t, lang } from './i18n.js';
const tr = (key, ...a) => t(navigator.language, key, ...a);
document.documentElement.lang = lang(navigator.language);
for (const id of ['openLocal', 'help']) document.getElementById(id).textContent = tr(id);
const status = document.getElementById('status'), file = document.getElementById('file');
status.textContent = tr('waiting');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.xr.enabled = true;
renderer.domElement.style.display = 'none'; document.body.append(renderer.domElement); // shown once a project is open: preview from your seat
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101014);
scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 2.5), new THREE.GridHelper(40, 40, 0x444444, 0x222222));
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 100);
const rig = new THREE.Group(); rig.add(camera); scene.add(rig);
const band = new THREE.Group(), stands = new THREE.Group(); scene.add(band, stands);
let sheets = []; // one per score, shared by the stands showing it
const podium = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.15, 24), new THREE.MeshStandardMaterial({ color: 0x888888 }));
podium.position.y = 0.075; scene.add(podium);
const cube = new THREE.BoxGeometry(0.5, 0.5, 0.5);

function label(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 48;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.font = '28px system-ui'; x.textAlign = 'center'; x.fillText(text, 128, 34);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  sp.scale.set(1, 0.19, 1); return sp;
}
function build3d() {
  band.children.forEach(o => o.traverse(m => { m.material?.map?.dispose(); m.material?.dispose(); }));
  band.clear();
  S.parts.forEach(p => {
    for (const s of S.seats.filter(s => s.part === p)) {
      const color = new THREE.Color().setHSL(p.hue / 360, 0.6, 0.45);
      const m = new THREE.Mesh(cube, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0 }));
      m.position.set(s.x, 0.75, s.y); m.userData.seat = s;
      const l = label(seatName(s)); l.position.y = 0.45; m.add(l);
      band.add(m);
    }
  });
}
// a stand in front of each musician (and of the podium) with their part, open like a book
async function buildStands() {
  sheets.forEach(sh => sh.texture.dispose()); sheets = []; stands.clear();
  const load = (dir, opts) => dir ? Sheet.load(dir, entry, opts).catch(() => null) : null; // older projects have no scores
  const [full, ...parts] = await Promise.all([load(S.project.sheet, { px: 2048, scale: 1.5, hue: 45 }), ...S.parts.map(p => load(p.sheet, { hue: p.hue }))]);
  const put = (sheet, x, z, [fx, fz], d) => {
    const stand = new THREE.Group(), book = sheet.stand();
    stand.position.set(x + fx * d, 1.15, z + fz * d); stand.rotation.y = Math.atan2(-fx, -fz); // facing its reader
    book.rotation.x = -0.35; stand.add(book); stands.add(stand);
  };
  if (full) put(full, 0, 0, [0, -1], 0.55);
  S.parts.forEach((p, i) => parts[i] && S.seats.filter(s => s.part === p).forEach(s => put(parts[i], s.x, s.y, facing(s), 0.55)));
  sheets = [full, ...parts].filter(Boolean);
}
function teleport(seat) {
  sitAt(seat);
  const [fx, fz] = facing(seat);
  rig.position.set(seat ? seat.x : 0, 0, seat ? seat.y : 0);
  rig.rotation.y = Math.atan2(-fx, -fz); // rotate the rig's -z onto the facing direction
  for (const m of band.children) m.visible = m.userData.seat !== seat; // don't sit inside your own cube
}

// transport panel at the listener's right hand; a child of the rig, so it follows them from seat to seat.
// Rows: stop, -10 s, play/pause, +10 s, leave VR · place (◀ seat ▶) · volume (−, bar, +) · time bar (touch = go there)
const PW = 0.4, PH = 0.25; // metres
const pc = document.createElement('canvas'); pc.width = 512; pc.height = 320;
const panel = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(pc), transparent: true }));
panel.position.set(0.32, 0.95, -0.38); panel.rotation.set(-0.7, -0.6, 0, 'YXZ'); rig.add(panel); // tilted towards the listener
const BAR = [96, 416]; // volume bar, canvas x
let drawn = '';
function drawPanel() {
  const t = now(), key = `${S.playing}:${Math.floor(t)}:${S.volume}:${S.seats.indexOf(S.listener)}`;
  if (key === drawn) return; drawn = key;
  const g = pc.getContext('2d'), mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  g.clearRect(0, 0, 512, 320); g.fillStyle = 'rgba(25,28,34,0.92)'; g.beginPath(); g.roundRect(0, 0, 512, 320, 24); g.fill();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  ['■', '−10', S.playing ? '❚❚' : '▶', '+10', '✕'].forEach((b, i) => { g.font = i % 2 ? '36px system-ui' : '50px system-ui'; g.fillStyle = i === 4 ? '#ff7b72' : '#e4e6eb'; g.fillText(b, 51 + i * 102.4, 48); });
  g.fillStyle = '#e4e6eb'; g.font = '40px system-ui'; g.fillText('◀', 48, 128); g.fillText('▶', 464, 128);
  g.font = '28px system-ui'; g.fillText(S.listener ? seatName(S.listener) : tr('conductorSeat'), 256, 128, 320);
  g.font = '44px system-ui'; g.fillText('−', 48, 196); g.fillText('+', 464, 196);
  g.fillStyle = '#2a2e37'; g.fillRect(BAR[0], 190, BAR[1] - BAR[0], 12); g.fillStyle = '#3ecf8e'; g.fillRect(BAR[0], 190, (BAR[1] - BAR[0]) * S.volume / MAXVOL, 12);
  g.fillStyle = '#8b909c'; g.font = '22px system-ui'; g.fillText(`${tr('volume')} ${Math.round(S.volume * 100)} %`, 256, 222);
  g.fillStyle = '#2a2e37'; g.fillRect(24, 262, 464, 12); g.fillStyle = '#4f8cff'; g.fillRect(24, 262, 464 * Math.min(1, t / (S.duration || 1)), 12);
  g.fillStyle = '#8b909c'; g.font = '22px system-ui'; g.fillText(`${mmss(t)} / ${mmss(S.duration)}`, 256, 298);
  panel.material.map.needsUpdate = true;
}
function pressPanel({ x, y }) { // uv: (0,0) bottom left
  const cx = x * 512, cy = (1 - y) * 320, clamp = v => Math.max(0, Math.min(1, v));
  if (cy > 240) return seek(clamp((cx - 24) / 464) * S.duration);
  if (cy > 164) return setVolume(cx < BAR[0] ? S.volume - 0.1 : cx > BAR[1] ? S.volume + 0.1 : clamp((cx - BAR[0]) / (BAR[1] - BAR[0])) * MAXVOL);
  if (cy > 96) { // places in order: the conductor, then every chair
    if (cx > BAR[0] && cx < BAR[1]) return;
    const places = [null, ...S.seats], k = places.indexOf(S.listener) + (cx < 256 ? -1 : 1);
    return teleport(places[(k + places.length) % places.length]);
  }
  [stop, () => seek(Math.max(0, now() - 10)), () => S.playing ? pause() : play(), () => seek(Math.min(S.duration, now() + 10)), () => renderer.xr.getSession()?.end()][Math.min(4, Math.floor(x * 5))]();
}

// hands or controllers: pinch / trigger on a cube = sit there, on the podium = conductor, on the panel = transport; grip = play/pause
const ray = new THREE.Raycaster(), tmp = new THREE.Matrix4(), hands = new XRHandModelFactory();
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  c.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -5)]), new THREE.LineBasicMaterial({ color: 0xffffff })));
  c.addEventListener('select', () => {
    tmp.identity().extractRotation(c.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(c.matrixWorld); ray.ray.direction.set(0, 0, -1).applyMatrix4(tmp);
    const hit = ray.intersectObjects([panel, ...band.children, podium], false)[0];
    if (hit?.object === panel) pressPanel(hit.uv);
    else if (hit) teleport(hit.object === podium ? null : hit.object.userData.seat);
  });
  c.addEventListener('squeeze', () => S.playing ? pause() : play());
  rig.add(c);
  const hand = renderer.xr.getHand(i); hand.add(hands.createHandModel(hand, 'mesh')); rig.add(hand);
}
// touch the panel with an index fingertip: press once when the finger goes through it
const tip = new THREE.Vector3(), touching = [false, false];
function poke() {
  for (let i = 0; i < 2; i++) {
    const j = renderer.xr.getHand(i).joints['index-finger-tip'];
    if (!j?.visible) { touching[i] = false; continue; }
    panel.worldToLocal(j.getWorldPosition(tip));
    const on = Math.abs(tip.z) < 0.015 && Math.abs(tip.x) < PW / 2 && Math.abs(tip.y) < PH / 2;
    if (on && !touching[i]) pressPanel({ x: tip.x / PW + 0.5, y: tip.y / PH + 0.5 });
    touching[i] = on;
  }
}

const head = new THREE.Vector3(), fwd = new THREE.Vector3(), up = new THREE.Vector3(), q = new THREE.Quaternion();
renderer.setAnimationLoop(() => {
  if (!S.project) return;
  if (renderer.xr.isPresenting) {
    const cam = renderer.xr.getCamera(); // head pose drives the ears
    cam.getWorldPosition(head); cam.getWorldDirection(fwd); up.set(0, 1, 0).applyQuaternion(cam.getWorldQuaternion(q));
    setHead(head.x, head.y, head.z, fwd.x, fwd.y, fwd.z, up.x, up.y, up.z);
    poke();
  } else { // flat preview: eyes of a seated player, or of the standing conductor
    const c = renderer.domElement; if (c.width !== c.clientWidth) { renderer.setSize(c.clientWidth, c.clientHeight, false); camera.aspect = c.clientWidth / c.clientHeight; camera.updateProjectionMatrix(); }
    camera.position.set(0, S.listener ? 1.2 : 1.65, 0); camera.rotation.x = -0.3;
  }
  meter(); drawPanel();
  const t = now(); for (const sh of sheets) sh.update(t);
  for (const m of band.children) { const lv = m.userData.seat.part.level || 0; m.material.emissiveIntensity = 1.5 * lv; m.scale.setScalar(1 + 0.2 * lv); }
  renderer.render(scene, camera);
});
renderer.xr.addEventListener('sessionstart', () => { ctx.resume(); S.headTracked = true; teleport(S.listener); });
renderer.xr.addEventListener('sessionend', () => { S.headTracked = false; pause(); placeAll(); });

async function open(blob) {
  status.textContent = tr('opening');
  const project = await openProject(blob);
  document.title = project.title + ' – MuseScoreVR';
  build3d(); teleport(null); await buildStands();
  renderer.domElement.style.display = '';
  status.textContent = tr('ready', project.title, S.seats.length);
  if (!document.getElementById('VRButton')) document.body.append(VRButton.createButton(renderer, { optionalFeatures: ['hand-tracking'] }));
}
const fail = e => status.textContent = tr('error', e.message || e);
file.onchange = () => file.files[0] && open(file.files[0]).catch(fail);
projectFromUrl().then(b => b && open(b)).catch(fail);

// the configurator pushes projects through the Bun server; reconnect if the PC goes away
(function listen() {
  const ws = new WebSocket(`wss://${location.host}/api/events`);
  ws.onmessage = async e => {
    const { cmd } = JSON.parse(e.data); // remote transport from the configurator
    if (cmd) return S.project && { play, pause, stop }[cmd]();
    status.textContent = tr('receiving');
    try {
      const r = await fetch('/api/project');
      if (!r.ok) throw new Error(`${tr('server')}: ${r.status}`);
      await open(await r.blob());
    } catch (e) { fail(e); }
  };
  ws.onclose = () => setTimeout(listen, 2000);
})();
</script>
</body>
</html>
